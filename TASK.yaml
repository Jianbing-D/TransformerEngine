  - id: 3
    name: "Brain storm better implementation for linear-cross-entropy fusion"
    status: "completed"
    steps:
      - analyze the linear-cross-entropy fusion algorithm with mathmetical analysis.
      - based on your understanding of the linear-cross-entropy fusion problem, brain storm better implementation for the problem.
      - current implementation is trying to hit a balance between performance and memory usage.
      - You must take data types into account, as it will affect the calculation precision. 
      - then consider different ways to implement it, mapping those concepts with cuteDSL APIs.
