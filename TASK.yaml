Description: "Tasks for Linear-Cross-Entropy fusion in TransformerEngine"
StatusDescription: "When a task is complete, the status field would be 'completed'"

Tasks:
  - id: 1
    name: "Understand the Linear-Cross-Entropy fusion code structure in TransformerEngine"
    status: "completed"
    material:
      - ./tests/pytorch/test_linear_cross_entropy.py contains the test code for Linear-Cross-Entropy fusion in TransformerEngine.
      - ./3rdparty/cutlass/ contains the critical components for Linear-Cross-Entropy fusion in TransformerEngine, cutlass and cuteDSL.
    steps:
      - read those materials in depth, write a detailed report about the code structure and data flow of Linear-cross-entropy fusion, including tensor shapes, data type.
      - record critical components and APIs that used in the Linear-cross-entropy fusion, including APIs from triton, APIs from cutlass, etc.
      - write a detailed report to KNOWLEDGE.md, with the learnings and insights you have gained. Try to separate different concepts and parts in different sections.
      - write a detailed plan to PROGRESS.md first, with TODO-list for each step. Then follow the plan to implement the task.
    permissions:
      - You MUST NOT execute git commit command in any way.
      - You may start sub-agents to help you with the task.
      - You have access to all files in the current directory.
  - id: 2
    name: "Use static tile scheduler in fwd_mainloop.py"
    status: "completed"
    material:
      - ./transformer_engine/common/cutedsl/linear_cross_entropy/blackwell/fwd_mainloop.py contains the forward mainloop kernel implementation.
      - ./transformer_engine/common/cutedsl/linear_cross_entropy/scheduler.py contains the static tile scheduler implementation.
      - ./Makefile contains the test command for the kernel.
    steps:
      - read the materials in depth, understand how the kernel works with the current tile indices.
      - apply the static tile scheduler to the kernel, make the kernel run in a persistent way.
      - write a detailed report to KNOWLEDGE.md about the static tile scheduler and how it works.
      - write a detailed plan to PROGRESS.md first, with TODO-list for each step. Then follow the plan to implement the task.
      - when you updated code, use make unit-test-1gpu to make sure the kernel works correctly.
    permissions:
      - You MUST NOT execute git commit command in any way.
      - You may start sub-agents to help you with the task.
      - You have access to all files in the current directory.
  - id: 3
    name: "Brain storm better implementation for linear-cross-entropy fusion"
    status: "not started"
    steps:
      - analyze the linear-cross-entropy fusion algorithm with mathmetical analysis.
      - based on your understanding of the linear-cross-entropy fusion problem, brain storm better implementation for the problem.
      - current implementation is trying to hit a balance between performance and memory usage.
      - You must take data types into account, as it will affect the calculation precision. 
      - then consider different ways to implement it, mapping those concepts with cuteDSL APIs.
      - write a detailed report to KNOWLEDGE.md about the different implementations and their trade-offs.
      - write a detailed plan to PROGRESS.md first, with TODO-list for each step. Then follow the plan to implement the task.